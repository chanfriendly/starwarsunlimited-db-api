<!DOCTYPE html>
<html>
<head>
  <title>Login Test</title>
</head>
<body>
  <h2>Login Test</h2>
  <button id="loginBtn">Test Login</button>
  <button id="checkAuthBtn">Check Auth</button>
  <pre id="output" style="background: #f0f0f0; padding: 10px; margin-top: 20px;"></pre>

  <script>
    const output = document.getElementById('output');
    
    // Log function
    function log(message) {
      output.textContent += message + '\n';
      console.log(message);
    }
    
    // Login test
    document.getElementById('loginBtn').addEventListener('click', async () => {
      output.textContent = ''; // Clear output
      log('Attempting login...');
      
      try {
        const loginResponse = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            username: 'testuser', 
            password: 'password123' 
          }),
          credentials: 'include'
        });
        
        const loginData = await loginResponse.json();
        
        log(`Login status: ${loginResponse.status}`);
        log(`Login response: ${JSON.stringify(loginData, null, 2)}`);
        
        // Check cookies
        log('Cookies after login:');
        log(document.cookie || '(No non-httpOnly cookies found)');
        
        // List response headers
        log('Response headers:');
        loginResponse.headers.forEach((value, key) => {
          log(`${key}: ${value}`);
        });
      } catch (error) {
        log(`Error: ${error.message}`);
      }
    });
    
    // Check auth
    document.getElementById('checkAuthBtn').addEventListener('click', async () => {
      output.textContent = ''; // Clear output
      log('Checking authentication...');
      
      try {
        const authResponse = await fetch('/api/auth/me', {
          credentials: 'include'
        });
        
        log(`Auth check status: ${authResponse.status}`);
        
        if (authResponse.ok) {
          const userData = await authResponse.json();
          log(`User data: ${JSON.stringify(userData, null, 2)}`);
        } else {
          log('Not authenticated');
        }
      } catch (error) {
        log(`Error: ${error.message}`);
      }
    });
  </script>
</body>
</html>
