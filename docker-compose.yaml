version: '3.8'
services:
  frontend:
    image: node:18-alpine
    platform: linux/amd64
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ${FRONTEND_PATH:-./frontend}:/app
    ports:
      - "4000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped
    networks:
      - twinsuns_network
    depends_on:
      - backend

  backend:
    image: python:3.10-slim
    platform: linux/amd64
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ${BACKEND_PATH:-./backend}:/app
      # Mount database directory to /data/.swu to match the backend code expectations
      - ${DATABASE_PATH:-./databases}:/data
    ports:
      - "8000:8000"
    environment:
      # Set the database paths to match the mounted volumes
      - DB_DIR=/data/.swu
      - DATABASE_URL=sqlite:////data/.swu/swu_app.db
      - CARD_DATABASE_URL=sqlite:////data/.swu/swu_cards.db
      - JWT_SECRET=${JWT_SECRET:-development_secret_change_in_production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:4000,http://localhost:8000
    restart: unless-stopped
    networks:
      - twinsuns_network

networks:
  twinsuns_network:
    driver: bridge