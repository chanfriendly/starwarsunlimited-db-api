version: '3.8'

# Development Docker Compose for Star Wars Unlimited
# Uses environment variables from .env.dev file

services:
  frontend:
    image: node:18-alpine
    platform: linux/amd64
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ${FRONTEND_PATH:-./frontend}:/app
    ports:
      - "${FRONTEND_PORT:-4000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED:-1}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    networks:
      - twinsuns_network
    depends_on:
      - backend

  backend:
    image: python:3.10-slim
    platform: linux/amd64
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ${BACKEND_PATH:-./backend}:/app
      - ${DATABASE_PATH:-./databases}:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Database configuration
      - DB_DIR=${DB_DIR:-/data}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/swu_app.db}
      - CARD_DATABASE_URL=${CARD_DATABASE_URL:-sqlite:////data/swu_cards.db}
      
      # Security
      - JWT_SECRET=${JWT_SECRET:-development_secret_change_in_production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      
      # CORS and networking
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4000,http://localhost:8000}
      
      # Application settings
      - PYTHONPATH=${PYTHONPATH:-/app}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    restart: unless-stopped
    networks:
      - twinsuns_network

networks:
  twinsuns_network:
    driver: bridge