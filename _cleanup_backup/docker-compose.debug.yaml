version: '3.8'

# Production Docker Compose for Star Wars Unlimited
# Clean, simple setup using pre-built images

services:
  frontend:
    image: chanfriendly/starwarsunlimited-db-api-frontend:latest
    container_name: twinsuns-frontend
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://192.168.1.124:8000
    networks:
      - twinsuns
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: chanfriendly/starwarsunlimited-db-api-backend:latest
    container_name: twinsuns-backend
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount database directory - this is the ONLY volume we need
      - /mnt/volume1/docker/twinsuns/databases:/databases
    environment:
      # Database configuration
      - DATABASE_URL=sqlite:////databases/app_db/swu_app.db
      - CARD_DATABASE_URL=sqlite:////databases/cards_db/swu_cards.db
      
      # Security
      - JWT_SECRET=${JWT_SECRET:-e21bb8c4cafa9305eb5d0dc9610e9b463b97994ac2dce5c337739461d7c389a5}
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      
      # CORS and networking
      - CORS_ALLOWED_ORIGINS=http://192.168.1.124:4000
      
      # Application settings
      - PYTHONPATH=/app
      - LOG_LEVEL=DEBUG
    networks:
      - twinsuns
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Temporary diagnostic container to check database mount
  db-check:
    image: alpine:latest
    container_name: twinsuns-db-check
    volumes:
      - /mnt/volume1/docker/twinsuns/databases:/databases
    command: |
      sh -c "
        echo '=== Database Mount Diagnostic ==='
        echo 'Contents of /databases:'
        ls -la /databases/
        echo ''
        echo 'Contents of /databases/app_db:'
        ls -la /databases/app_db/ 2>/dev/null || echo 'app_db directory not found'
        echo ''
        echo 'Contents of /databases/cards_db:'
        ls -la /databases/cards_db/ 2>/dev/null || echo 'cards_db directory not found'
        echo ''
        echo 'Checking file permissions:'
        stat /databases/app_db/swu_app.db 2>/dev/null || echo 'swu_app.db not found'
        stat /databases/cards_db/swu_cards.db 2>/dev/null || echo 'swu_cards.db not found'
        echo '=== End Diagnostic ==='
        sleep 30
      "

networks:
  twinsuns:
    driver: bridge
    name: twinsuns_network