name: Manual Deploy to NAS

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        ref: main
    
    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.0
      with:
        ssh-private-key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
    
    - name: Log deployment reason
      run: echo "Deploying to ${{ github.event.inputs.environment }} - ${{ github.event.inputs.reason }}"
    
    - name: Create .env file
      run: |
        cat > .env << EOF
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        ACCESS_TOKEN_EXPIRE_MINUTES=10080
        DATABASE_URL=sqlite:////data/.swu/swu_app.db
        CARD_DATABASE_URL=sqlite:////data/.swu/swu_cards.db
        NEXT_PUBLIC_API_URL=https://twinsuns.chanfriendly.duckdns.org/api
        EOF
    
    - name: Deploy to NAS
      run: |
        # Copy .env file
        scp .env ${{ secrets.NAS_USER }}@${{ secrets.NAS_HOST }}:/path/to/twinsuns/app/.env
        
        # Deploy application
        ssh ${{ secrets.NAS_USER }}@${{ secrets.NAS_HOST }} << EOF
          cd /path/to/twinsuns/app
          git pull origin main
          # Create backup of databases
          mkdir -p /path/to/twinsuns/backups
          cp /mnt/tank/apps/twinsuns/databases/*.db /path/to/twinsuns/backups/
          # Restart containers
          docker-compose down
          docker-compose build
          docker-compose up -d
          # Check if containers are running
          docker-compose ps
        EOF
    
    - name: Notify on successful deployment
      if: success()
      run: echo "Deployment to ${{ github.event.inputs.environment }} completed successfully"

    - name: Notify on failed deployment
      if: failure()
      run: echo "Deployment to ${{ github.event.inputs.environment }} failed"