version: '3.8'

# Production Docker Compose for Star Wars Unlimited
# Deployed via Portainer on TrueNAS (192.168.1.124:9004), stack ID 94, endpointId 3
# deploy.sh builds+pushes images and triggers Portainer to redeploy automatically.
#
# Key env vars (set in Portainer stack env or .env.prod):
#   JWT_SECRET              — required, no default
#   CORS_ALLOWED_ORIGINS    — e.g. http://192.168.1.124:4000
#   SMTP_USER               — Gmail address for sending password reset emails
#   SMTP_PASSWORD           — Gmail App Password (not your regular password)
#   SMTP_FROM               — optional display name + address (default: Twin Suns <chanfriendly@gmail.com>)
#   APP_BASE_URL            — public URL used in reset links, e.g. https://twinsuns.chanfriendly.duckdns.org
#
# This file is the single source of truth. Keep Portainer's copy in sync.

services:
  frontend:
    image: chanfriendly/starwarsunlimited-db-api-frontend:latest
    container_name: twinsuns-frontend
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://backend:8000
    networks:
      - twinsuns
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: chanfriendly/starwarsunlimited-db-api-backend:latest
    container_name: twinsuns-backend
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - /mnt/volume1/docker/twinsuns/databases:/databases
    environment:
      # Database paths — the working layout on TrueNAS has subdirectories
      - DATABASE_URL=sqlite:////databases/app_db/swu_app.db
      - CARD_DATABASE_URL=sqlite:////databases/cards_db/swu_cards.db

      # Security
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440

      # CORS — only the frontend origin needs to be listed
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://192.168.1.124:4000}

      # Password reset emails via Gmail SMTP
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:-Twin Suns <chanfriendly@gmail.com>}
      - APP_BASE_URL=${APP_BASE_URL:-http://192.168.1.124:4000}

      # Application settings
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
    networks:
      - twinsuns
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  twinsuns:
    driver: bridge
    name: twinsuns_network
