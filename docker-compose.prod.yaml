version: '3.8'

# Production Docker Compose for Star Wars Unlimited
# Uses environment variables from .env.prod file

services:
  frontend:
    image: chanfriendly/starwarsunlimited-db-api-frontend:latest
    container_name: twinsuns-frontend
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      # Client-side API URL (for browser requests)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      # Server-side API URL (for Next.js API routes)
      - INTERNAL_API_URL=${INTERNAL_API_URL}
    networks:
      - twinsuns
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: chanfriendly/starwarsunlimited-db-api-backend:latest
    container_name: twinsuns-backend
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Mount database directory - path from environment variable
      - ${PRODUCTION_DATABASE_PATH:-/mnt/volume1/docker/twinsuns/databases}:/databases
    environment:
      # Database configuration
      - DB_DIR=${DB_DIR:-/databases}
      - DATABASE_URL=${DATABASE_URL}
      - CARD_DATABASE_URL=${CARD_DATABASE_URL}
      
      # Security
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      
      # CORS and networking
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      
      # Application settings
      - PYTHONPATH=${PYTHONPATH:-/app}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - twinsuns
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 30s
      timeout: 30s
      start-period: 60s
      retries: 5

networks:
  twinsuns:
    driver: bridge
    name: twinsuns_network