name: Update Card Database

# Rebuilds swu_cards.db from the official SWU API every Monday at 2 AM UTC.
# Can also be triggered manually via workflow_dispatch.
# The built database is uploaded as a GitHub Actions artifact (not committed to git).

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  update-card-database:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Build card database
        env:
          DB_DIR: ${{ github.workspace }}/databases
        run: |
          mkdir -p databases
          cd backend
          python scripts/build_database.py

      - name: Upload card database
        uses: actions/upload-artifact@v4
        with:
          name: swu-card-database
          path: databases/swu_cards.db
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: card-database-build-log
          path: backend/database_build.log
          retention-days: 7
