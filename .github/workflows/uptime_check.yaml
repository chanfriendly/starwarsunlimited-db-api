name: Uptime Check

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://twinsuns.chanfriendly.duckdns.org/api/health)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "UNHEALTHY — got $STATUS"
            exit 1
          fi
          echo "OK"

      # Email alert is best-effort. It requires the SMTP_USER / SMTP_PASSWORD /
      # ALERT_EMAIL repo secrets to be set (`gh secret set ...`). If they are
      # missing the action errors ("Input required and not supplied: from"),
      # so continue-on-error keeps that from masking the real health signal —
      # the failed health-check step above is what marks the run red, and
      # GitHub also emails the repo owner on any failed scheduled run.
      - name: Send alert on failure
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🔴 Twin Suns is DOWN"
          to: ${{ secrets.ALERT_EMAIL }}
          from: ${{ secrets.SMTP_USER }}
          body: |
            The Twin Suns healthcheck failed at ${{ github.run_id }}.

            URL: https://twinsuns.chanfriendly.duckdns.org/api/health

            Check Portainer or the TrueNAS Docker stack.
